# 从源码构建版（不走 ghcr.io 镜像）。
# 什么时候用：想本地改完直接验证，或者镜像还没构建出来。
# 用法：docker compose -f docker-compose.build.yml up -d --build
services:
  unicheckin:
    build: .
    image: unicheckin:local
    container_name: unicheckin
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./config:/unicheckin/config
      - ./logs:/unicheckin/logs
      - ./data:/unicheckin/data
      - ./cron:/unicheckin/cron
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PANEL_PORT','8080')+'/api/health',timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
